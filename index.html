<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermacity - ¡Atiende Fernanda!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #e0f2fe; display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; }
        h1 { color: #0284c7; margin-bottom: 10px; font-size: 1.5rem; text-align: center; }
        
        #game-board {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border: 4px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            position: relative;
        }

        #hud {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #0284c7;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 15px;
            align-items: center;
        }

        .btn-pause {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-pause:hover { background: #d97706; }

        .main-stage {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media(max-width: 600px) {
            .main-stage { grid-template-columns: 1fr; }
        }

        .section-title {
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 8px;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 4px;
        }

        /* Banner de Bonus Track */
        #bonus-banner {
            display: none;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.99); }
            to { transform: scale(1.01); }
        }

        /* Estantería optimizada de máximo 16 botones perfectamente visibles */
        .med-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 360px;
            overflow: hidden;
        }

        .med-btn {
            background: #f0f9ff;
            border: 2px solid #38bdf8;
            border-radius: 6px;
            padding: 8px 4px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
            font-weight: 600;
            color: #0369a1;
            transition: all 0.2s;
            word-break: break-word;
        }

        .med-btn.bonus-item {
            background: #fdf2f8;
            border-color: #f472b6;
            color: #be185d;
        }

        .med-btn:active { background: #38bdf8; color: white; transform: scale(0.96); }

        .med-btn.changing {
            opacity: 0.2;
            transform: scale(0.8);
        }

        /* Fila de clientes */
        #customers-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }

        .customer-card {
            background: #fffbebfb;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .customer-card:active {
            transform: scale(0.98);
        }

        .customer-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .timer-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.1s linear, background-color 0.3s;
        }

        /* Status de Fernanda */
        #hand-status {
            margin-top: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #334155;
            border: 1px dashed #94a3b8;
        }

        /* Modal de Pausa */
        #pause-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            border-radius: 12px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        #pause-overlay h2 { font-size: 2rem; margin-bottom: 15px; }

        /* Pie de página */
        footer {
            margin-top: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
        }
        .creator-text {
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h1>💊 Fermacity: ¡Atiende Fernanda!</h1>

    <div id="game-board">
        <div id="pause-overlay">
            <h2>⏸️ JUEGO EN PAUSA</h2>
            <button class="btn-pause" style="padding: 10px 20px; font-size: 1rem;" onclick="togglePause()">Reanudar</button>
        </div>

        <div id="hud">
            <div>Nivel: <span id="level">1</span>/100</div>
            <div>Puntos: <span id="score">0</span></div>
            <div>Atendidos: <span id="served">0</span></div>
            <div>Perdidos: <span id="lost" style="color: #fca5a5;">0</span></div>
            <div><button class="btn-pause" onclick="togglePause()" id="pause-btn">Pausa ⏸️</button></div>
        </div>

        <div id="bonus-banner">🎉 ¡BONUS TRACK! Productos Varios de Farmacia 🎉</div>

        <div class="main-stage">
            <div>
                <div class="section-title">📦 Estante (<span id="med-count">0</span> tipos)</div>
                <div class="med-grid" id="shelves"></div>
            </div>

            <div>
                <div class="section-title">👥 Clientes Esperando</div>
                <div id="customers-container"></div>
            </div>
        </div>

        <div id="hand-status">
            👩‍⚕️ Fernanda tiene en mano: <span id="holding-item" style="color: #0284c7;">Nada</span>
        </div>
    </div>

    <footer>
        <span class="creator-text">Creado por Dani v1</span>
    </footer>

    <script>
        // Productos Especiales Bonus Track (Niveles 20, 40, 60, 80)
        const bonusItems = [
            "Desodorante", "Papel Higiénico", "Consolador",
            "Vaselina", "Condones", "Shampoo", "Preservativos",
            "Prueba Embarazo", "Talco Pies", "Toallitas Femeninas",
            "Jabón Neutro", "Gel Íntimo", "Enjuague Bocal", "Cepillo Dental"
        ];

        // Banco de medicamentos estándar (Cada 5 niveles desbloquea un bloque)
        const medPools = [
            ["Paracetamol", "Amoxicilina", "Lorazepam", "Ibuprofeno", "Amlodipino"],
            ["Atorvastatina", "Levotiroxina", "Telmisartán", "Gliclazida", "Clonazepam"],
            ["Hidroclorotiazida", "Ciprofloxacino", "Metoclopramida", "Ezetimiba"],
            ["Sulfametoxazol", "Nitrofurantoína", "Levosulpirida", "Dexketoprofeno"],
            ["Dextrometorfano", "Clufenanamato", "Butilhioscina", "Betametasona"],
            ["Dexmedetomidina", "Levetiracetam", "Pipemídico Ácido", "Moxifloxacino"],
            ["Eslicarbazepina", "Acetilcisteína", "Fondaparinux", "Cloperastina"],
            ["Piperacilina-Tazobactam", "Trimetoprima", "Suxametonio", "Zuclopentixol"],
            ["Lercanidipino", "Sildenafil-Tadalafil", "Fenilbutazona", "Trihexifenidilo"],
            ["Clanobutina", "Metilprednisolona", "Ciclofosfamidasa", "Desoximetasona"],
            ["Cianocobalamina", "Anfotericina B", "Fludarabina", "Etopósido"],
            ["Levomepromazina", "Oxcarbazepina", "Pargilina", "Ganciclovir"],
            ["Teriparatida", "Lacosamida", "Cromoglicato", "Cabergolina"],
            ["Melfalán", "Clormadinona", "Mitomicina", "Fludarabina"],
            ["Sulfasalazina", "Nintedanib", "Secukinumab", "Eculizumab"],
            ["Vedolizumab", "Tofacitinib", "Brodalumab", "Ixekizumab"],
            ["Idarucizumab", "Sugammadex", "Evolocumab", "Alirocumab"],
            ["Crizotinib", "Ceritinib", "Alectinib", "Brigatinib"],
            ["Osimertinib", "Gefitinib", "Erlotinib", "Afatinib"],
            ["Pembrolizumab", "Nivolumab", "Atezolizumab", "Durvalumab"]
        ];

        let currentLevel = 1;
        let score = 0;
        let servedCount = 0;
        let lostCount = 0;
        let holding = null;
        let customers = [];
        let customerIdCounter = 0;
        let isPaused = false;
        let isBonusLevel = false;

        let availableMeds = [];
        let displayedMeds = [];

        function checkBonusLevel() {
            return [20, 40, 60, 80].includes(currentLevel);
        }

        // Calcula cuántos items máximos entran al estante según el nivel (de 4 a 16)
        function getMaxShelfCapacity() {
            if (currentLevel <= 3) return 4;
            if (currentLevel <= 7) return 6;
            if (currentLevel <= 12) return 8;
            if (currentLevel <= 18) return 12;
            return 16; // Límite estricto de 16 productos
        }

        function updateAvailableMeds() {
            isBonusLevel = checkBonusLevel();
            const bonusBanner = document.getElementById('bonus-banner');

            if (isBonusLevel) {
                availableMeds = [...bonusItems];
                bonusBanner.style.display = 'block';
            } else {
                bonusBanner.style.display = 'none';
                const tier = Math.min(Math.floor((currentLevel - 1) / 5) + 1, medPools.length);
                availableMeds = [];
                for (let i = 0; i < tier; i++) {
                    availableMeds = availableMeds.concat(medPools[i]);
                }
            }
            shuffleShelves();
        }

        function shuffleShelves() {
            const capacity = getMaxShelfCapacity();
            // Desordenar todo el pozo disponible
            let shuffledPool = [...availableMeds].sort(() => Math.random() - 0.5);

            // Asegurar que si hay clientes esperando, sus medicamentos solicitados estén SIEMPRE en el estante
            const activeCustomerMeds = customers.map(c => c.med);
            let selected = [];

            activeCustomerMeds.forEach(med => {
                if (!selected.includes(med) && selected.length < capacity) {
                    selected.push(med);
                }
            });

            // Llenar el resto de los lugares hasta el límite de capacidad
            shuffledPool.forEach(med => {
                if (!selected.includes(med) && selected.length < capacity) {
                    selected.push(med);
                }
            });

            // Desordenar de nuevo la selección final
            displayedMeds = selected.sort(() => Math.random() - 0.5);
            renderShelves();
        }

        function renderShelves() {
            const shelvesEl = document.getElementById('shelves');
            shelvesEl.innerHTML = '';
            document.getElementById('med-count').innerText = displayedMeds.length;

            displayedMeds.forEach(med => {
                const btn = document.createElement('button');
                btn.className = 'med-btn' + (isBonusLevel ? ' bonus-item' : '');
                btn.innerText = med;
                btn.onclick = () => pickMed(med);
                shelvesEl.appendChild(btn);
            });
        }

        // Rotación de productos en el estante cada 10 segundos
        function dynamicShelfShift() {
            if (isPaused) return;
            const btns = document.querySelectorAll('.med-btn');
            if (btns.length === 0) return;

            const randomIndex = Math.floor(Math.random() * btns.length);
            const btn = btns[randomIndex];
            
            btn.classList.add('changing');
            setTimeout(() => {
                shuffleShelves();
            }, 300);
        }

        function pickMed(med) {
            if (isPaused) return;
            holding = med;
            document.getElementById('holding-item').innerText = med;
        }

        function getMaxCustomers() {
            if (currentLevel < 5) return 2;
            if (currentLevel < 15) return 3;
            if (currentLevel < 30) return 4;
            if (currentLevel < 50) return 5;
            return 6;
        }

        function spawnCustomer() {
            if (isPaused) return;

            const maxAllowed = getMaxCustomers();
            if (customers.length >= maxAllowed) return;

            // Seleccionar únicamente entre los productos visibles en el estante
            const randomMed = displayedMeds[Math.floor(Math.random() * displayedMeds.length)];
            
            const baseTime = Math.max(12 - (currentLevel * 0.1), 3.5);

            const customer = {
                id: ++customerIdCounter,
                med: randomMed,
                maxTime: baseTime,
                timeRight: baseTime
            };

            customers.push(customer);
            renderCustomers();
        }

        function renderCustomers() {
            const container = document.getElementById('customers-container');
            container.innerHTML = '';

            customers.forEach(c => {
                const card = document.createElement('div');
                card.className = 'customer-card';
                card.onclick = () => serveCustomer(c.id);

                const pct = Math.max(0, (c.timeRight / c.maxTime) * 100);
                let color = '#22c55e';
                if (pct < 50) color = '#eab308';
                if (pct < 25) color = '#ef4444';

                card.innerHTML = `
                    <div class="customer-info">
                        <span>👤 Cliente solicita:</span>
                        <span style="color:${isBonusLevel ? '#be185d' : '#d97706'}">${c.med}</span>
                    </div>
                    <div class="timer-bar">
                        <div class="timer-fill" style="width: ${pct}%; background-color: ${color};"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function serveCustomer(id) {
            if (isPaused || !holding) return;

            const index = customers.findIndex(c => c.id === id);
            if (index === -1) return;

            if (customers[index].med === holding) {
                const bonusPoints = isBonusLevel ? 200 : 100;
                score += bonusPoints + Math.floor(customers[index].timeRight * 10);
                servedCount++;
                
                // Avanzar de nivel cada 5 atendidos
                const newLevel = Math.min(100, Math.floor(servedCount / 5) + 1);
                if (newLevel !== currentLevel) {
                    currentLevel = newLevel;
                    updateAvailableMeds();
                }

                customers.splice(index, 1);
            } else {
                score = Math.max(0, score - 50);
                alert('❌ ¡Artículo/Medicamento equivocado!');
            }

            holding = null;
            document.getElementById('holding-item').innerText = 'Nada';
            updateHUD();
            renderCustomers();
        }

        function updateHUD() {
            document.getElementById('level').innerText = currentLevel;
            document.getElementById('score').innerText = score;
            document.getElementById('served').innerText = servedCount;
            document.getElementById('lost').innerText = lostCount;
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
            document.getElementById('pause-btn').innerText = isPaused ? 'Reanudar ▶️' : 'Pausa ⏸️';
        }

        // Bucle del temporizador principal
        setInterval(() => {
            if (isPaused) return;

            for (let i = customers.length - 1; i >= 0; i--) {
                customers[i].timeRight -= 0.1;
                if (customers[i].timeRight <= 0) {
                    customers.splice(i, 1);
                    lostCount++;
                    score = Math.max(0, score - 30);
                    updateHUD();
                }
            }
            renderCustomers();
        }, 100);

        function getSpawnInterval() {
            return Math.max(800, 2500 - (currentLevel * 25));
        }

        function scheduleNextSpawn() {
            setTimeout(() => {
                spawnCustomer();
                scheduleNextSpawn();
            }, getSpawnInterval());
        }

        // Rotación de estante ajustada a 10 segundos
        setInterval(dynamicShelfShift, 10000);

        // Inicialización
        updateAvailableMeds();
        updateHUD();
        spawnCustomer();
        spawnCustomer();
        scheduleNextSpawn();
    </script>
</body>
</html>
