<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermacity - ¡Despacha rápido, Fernanda!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #e0f2fe; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        h1 { color: #0284c7; margin-bottom: 10px; font-size: 1.5rem; text-align: center; }
        
        #game-board {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border: 4px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        #hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: #0284c7;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .main-stage {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media(max-width: 600px) {
            .main-stage { grid-template-columns: 1fr; }
        }

        .section-title {
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 8px;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 4px;
        }

        /* Estantería de medicamentos */
        .med-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .med-btn {
            background: #f0f9ff;
            border: 2px solid #38bdf8;
            border-radius: 6px;
            padding: 8px 5px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
            font-weight: 600;
            color: #0369a1;
            transition: all 0.1s;
        }

        .med-btn:active { background: #38bdf8; color: white; transform: scale(0.96); }

        /* Fila de clientes */
        #customers-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }

        .customer-card {
            background: #fffbebfb;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        .customer-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .timer-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.1s linear, background-color 0.3s;
        }

        /* Status de Fernanda */
        #hand-status {
            margin-top: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #334155;
            border: 1px dashed #94a3b8;
        }
    </style>
</head>
<body>

    <h1>💊 Fermacity: ¡Atiende Fernanda!</h1>

    <div id="game-board">
        <div id="hud">
            <div>Nivel: <span id="level">1</span>/100</div>
            <div>Puntos: <span id="score">0</span></div>
            <div>Atendidos: <span id="served">0</span></div>
            <div>Perdidos: <span id="lost" style="color: #fca5a5;">0</span></div>
        </div>

        <div class="main-stage">
            <div>
                <div class="section-title">📦 Estante (<span id="med-count">0</span> tipos)</div>
                <div class="med-grid" id="shelves"></div>
            </div>

            <div>
                <div class="section-title">👥 Clientes Esperando</div>
                <div id="customers-container"></div>
            </div>
        </div>

        <div id="hand-status">
            👩‍⚕️ Fernanda tiene en mano: <span id="holding-item" style="color: #0284c7;">Nada</span>
        </div>
    </div>

    <script>
        // Banco de medicamentos organizados por dificultad (bloques de 10 niveles)
        const medPools = [
            // Niveles 1-10
            ["Paracetamol", "Amoxicilina", "Lorazepam", "Ibuprofeno", "Amlodipino"],
            // Niveles 11-20
            ["Atorvastatina", "Levotiroxina", "Telmisartán", "Gliclazida", "Clonazepam"],
            // Niveles 21-30
            ["Hidroclorotiazida", "Ciprofloxacino", "Metoclopramida", "Ezetimiba"],
            // Niveles 31-40
            ["Sulfametoxazol", "Nitrofurantoína", "Levosulpirida", "Dexketoprofeno"],
            // Niveles 41-50
            ["Dextrometorfano", "Clufenanamato", "Butilhioscina", "Betametasona"],
            // Niveles 51-60
            ["Dexmedetomidina", "Levetiracetam", "Pipemídico Ácido", "Moxifloxacino"],
            // Niveles 61-70
            ["Eslicarbazepina", "Acetilcisteína", "Fondaparinux", "Cloperastina"],
            // Niveles 71-80
            ["Piperacilina-Tazobactam", "Trimetoprima", "Suxametonio", "Zuclopentixol"],
            // Niveles 81-90
            ["Lercanidipino", "Sildenafil-Tadalafil", "Fenilbutazona", "Trihexifenidilo"],
            // Niveles 91-100 (Extremos)
            ["Clanobutina", "Metilprednisolona", "Ciclofosfamidasa", "Desoximetasona"]
        ];

        let currentLevel = 1;
        let score = 0;
        let servedCount = 0;
        let lostCount = 0;
        let holding = null;
        let customers = [];
        let customerIdCounter = 0;

        let availableMeds = [];

        function updateAvailableMeds() {
            // Se calcula qué bloques desbloquear según el nivel
            const tier = Math.min(Math.floor((currentLevel - 1) / 10) + 1, medPools.length);
            availableMeds = [];
            for (let i = 0; i < tier; i++) {
                availableMeds = availableMeds.concat(medPools[i]);
            }
            renderShelves();
        }

        function renderShelves() {
            const shelvesEl = document.getElementById('shelves');
            shelvesEl.innerHTML = '';
            document.getElementById('med-count').innerText = availableMeds.length;

            availableMeds.forEach(med => {
                const btn = document.createElement('button');
                btn.className = 'med-btn';
                btn.innerText = med;
                btn.onclick = () => pickMed(med);
                shelvesEl.appendChild(btn);
            });
        }

        function pickMed(med) {
            holding = med;
            document.getElementById('holding-item').innerText = med;
        }

        function spawnCustomer() {
            if (customers.length >= 4) return; // Máximo 4 clientes a la vez

            const randomMed = availableMeds[Math.floor(Math.random() * availableMeds.length)];
            
            // A mayor nivel, menos tiempo de paciencia (mínimo 4.5 segundos)
            const baseTime = Math.max(12 - (currentLevel * 0.08), 4.5);

            const customer = {
                id: ++customerIdCounter,
                med: randomMed,
                maxTime: baseTime,
                timeRight: baseTime
            };

            customers.push(customer);
            renderCustomers();
        }

        function renderCustomers() {
            const container = document.getElementById('customers-container');
            container.innerHTML = '';

            customers.forEach(c => {
                const card = document.createElement('div');
                card.className = 'customer-card';
                card.onclick = () => serveCustomer(c.id);

                const pct = Math.max(0, (c.timeRight / c.maxTime) * 100);
                let color = '#22c55e';
                if (pct < 50) color = '#eab308';
                if (pct < 25) color = '#ef4444';

                card.innerHTML = `
                    <div class="customer-info">
                        <span>👤 Cliente:</span>
                        <span style="color:#d97706">${c.med}</span>
                    </div>
                    <div class="timer-bar">
                        <div class="timer-fill" style="width: ${pct}%; background-color: ${color};"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function serveCustomer(id) {
            if (!holding) return;

            const index = customers.findIndex(c => c.id === id);
            if (index === -1) return;

            if (customers[index].med === holding) {
                score += 100 + Math.floor(customers[index].timeRight * 10);
                servedCount++;
                
                // Subir de nivel cada 5 clientes atendidos (Hasta nivel 100)
                const newLevel = Math.min(100, Math.floor(servedCount / 5) + 1);
                if (newLevel !== currentLevel) {
                    currentLevel = newLevel;
                    updateAvailableMeds();
                }

                customers.splice(index, 1);
            } else {
                score = Math.max(0, score - 50);
                alert('❌ ¡Medicamento equivocado!');
            }

            holding = null;
            document.getElementById('holding-item').innerText = 'Nada';
            updateHUD();
            renderCustomers();
        }

        function updateHUD() {
            document.getElementById('level').innerText = currentLevel;
            document.getElementById('score').innerText = score;
            document.getElementById('served').innerText = servedCount;
            document.getElementById('lost').innerText = lostCount;
        }

        // Bucle principal del temporizador
        setInterval(() => {
            for (let i = customers.length - 1; i >= 0; i--) {
                customers[i].timeRight -= 0.1;
                if (customers[i].timeRight <= 0) {
                    customers.splice(i, 1); // Se va enojado
                    lostCount++;
                    score = Math.max(0, score - 30);
                    updateHUD();
                }
            }
            renderCustomers();
        }, 100);

        // La velocidad con la que llegan nuevos clientes se incrementa con el nivel
        function getSpawnInterval() {
            return Math.max(1200, 3500 - (currentLevel * 25));
        }

        function scheduleNextSpawn() {
            setTimeout(() => {
                spawnCustomer();
                scheduleNextSpawn();
            }, getSpawnInterval());
        }

        // Inicialización del juego
        updateAvailableMeds();
        updateHUD();
        scheduleNextSpawn();
    </script>
</body>
</html>
