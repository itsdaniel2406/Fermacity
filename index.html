<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermacity - ¡Farmacia Frenética!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #game-container { width: 800px; height: 600px; background-color: white; border: 4px solid #0056b3; border-radius: 10px; position: relative; overflow: hidden; display: flex; }
        
        /* Farmacéutica Fernanda */
        #fernanda { width: 60px; height: 100px; background-color: #fff; border: 2px solid #007bff; position: absolute; bottom: 50px; left: 370px; border-radius: 10px; text-align: center; color: #007bff; font-weight: bold; padding-top: 10px; }
        #fernanda::after { content: '👩‍⚕️ F'; font-size: 2em; display: block; }
        
        /* Estanterías */
        #shelves { width: 200px; height: 100%; background-color: #e6f7ff; border-right: 2px solid #b3e0ff; padding: 10px; box-sizing: border-box; }
        .shelf-item { background-color: white; border: 1px solid #cceeff; border-radius: 5px; padding: 5px; margin-bottom: 5px; cursor: pointer; text-align: center; font-size: 0.8em; }
        .shelf-item:hover { background-color: #e0f2fe; }
        
        /* Zona de Clientes */
        #customer-zone { flex: 1; position: relative; padding: 10px; }
        #counter { height: 10px; width: 100%; background-color: #007bff; position: absolute; bottom: 150px; left: 0; }
        .customer { width: 60px; height: 90px; background-color: #ffe082; border: 2px solid #fbc02d; position: absolute; bottom: 160px; border-radius: 10px; text-align: center; color: #fbc02d; font-weight: bold; padding-top: 10px; transition: left 0.5s; cursor: pointer; }
        .customer::after { content: '👤 C'; font-size: 2em; display: block; }
        .patience-bar { width: 100%; height: 5px; background-color: #ffcccc; position: absolute; top: -10px; left: 0; border-radius: 3px; }
        .patience-fill { height: 100%; background-color: #4caf50; border-radius: 3px; transition: width 0.1s linear; }

        /* UI de Puntuación y Estado */
        #hud { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 5px; text-align: right; }
        #order-box { position: absolute; bottom: 10px; left: 220px; background: #eee; padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 200px; text-align: center; font-size: 0.9em; min-height: 40px;}

    </style>
</head>
<body>

    <h1>Fermacity - ¡Despacha rápido, Fernanda!</h1>
    <div id="game-container">
        <div id="shelves">
            <h3>Medicamentos</h3>
            <div class="shelf-item" data-med="Paracetamol (Genérico)">Paracetamol (Genérico)</div>
            <div class="shelf-item" data-med="Amoxicilina">Amoxicilina</div>
            <div class="shelf-item" data-med="Lorazepam">Lorazepam
